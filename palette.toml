# 50: 17.5, 100: 16, 200: 14.5, 300: 12.5, 400: 10, 500: 7, 600: 4.5, 700: 3, 800: 2, 900: 1.5, 950: 1.25.
# The actual contrast is in each comment. "hand-picked" = the base color, kept exactly; everything
# else is generated (formula in README.md, "The scale").

