# Lasik palette
#
# The scale: every hue in steps 50 (lightest) to 950 (darkest), named NAME_<step>. Each step is a contrast
# against the background OBSIDIAN, so the number says what a color can do:
#   600 and lighter   text (WCAG AA, 4.5:1 or more)
#   500 and lighter   text in High Contrast (WCAG AAA, 7:1 or more)
#   700               a visible UI line or border (3:1)
#   800 and darker    backgrounds (hover, selection, highlights)
# NEUTRAL is the text, surfaces and lines: the hand-picked periwinkle #a8bcfc (NEUTRAL_400), a blue that's very
# easy to read on OBSIDIAN. The other hues are for syntax, terminal colors and accents. Each hue's hand-picked base color is kept exactly, at its nearest step.
# The scale is generated by scripts/scale.ts; how, and why, is in README.md ("The scale").
#
# Which program slot gets which step (Konsole "Intense", VS Code "ansiBright", ...) is decided by each
# theme, not here.

# ---- backgrounds
OBSIDIAN          = "#01030a"
OBSIDIAN_DEEP     = "#000105"  # generated: OBSIDIAN at half brightness (R, G, B halved), same hue. Lasik Dark High Contrast background
WHITE             = "#ffffff"

# ---- scale: generated by scripts/scale.ts, don't edit by hand ----
