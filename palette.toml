# ---- legacy tiers (before the scale, 2026-10-24)
# No port uses these any more (all moved to the scale, 2026-10-25). The VS Code build still reads them
# (vscode/scripts/palette.ts) to translate the old colors in its source into scale steps. The hand-picked
# base colors (RED, PEACH, ...) are what scripts/scale.ts builds the scale from, so keep those. SLATE, PERIWINKLE, LAVENDER and SILVER are NEUTRAL
# steps in the scale.
#
# Each color has up to five tiers, named after what the color is, not after where a
# program uses it (contrast is measured against OBSIDIAN):
#   NAME_MUTED   same lightness, less chroma (a tone: the color mixed with gray)
#   NAME         base color
#   NAME_DEEP    darker and more saturated (richer)
#   NAME_BRIGHT  lighter: the bright terminal colors (ANSI 8-15) use this tier
#   NAME_QUIET   35% of the base color mixed into OBSIDIAN, saved as a solid color.
#                Below WCAG contrast, so only the Lasik Dark Quiet variant uses it.
#                Exception: SLATE_QUIET is #2a324b (1.6:1), a dark surface color. The 35%
#                rule would give #161b2c (1.2:1), too close to the background to see.
#
# The formulas for every calculated color, with their ratios and exceptions, are in
# README.md, section "How the tiers are made".
#
# Which program slot gets which tier (Konsole "Intense", VS Code "ansiBright", ...) is
# decided by the theme generator, not here.
#
# DEEP colors are the original hand-picked "intense" colors. LAVENDER, ROSE,
# SKY, PERIWINKLE and SILVER had none, so theirs follow the median of the originals:
# lightness -0.076 and 1.31x the chroma (in OKLCH).
# MUTED colors of ROSE, SKY and PERIWINKLE keep the hue and lightness and take
# 0.564x the chroma (the median of the hand-picked ones). SILVER is a gray, so no MUTED tier.
