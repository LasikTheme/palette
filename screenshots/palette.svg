<svg xmlns="http://www.w3.org/2000/svg" width="1138" height="964" viewBox="0 0 1138 964" role="img" aria-labelledby="title desc">
<title id="title">Lasik palette on OBSIDIAN</title>
<desc id="desc">Every Lasik color in five tiers (muted, base, deep, bright, quiet) with its hex value and its contrast ratio against the OBSIDIAN background #01030a.</desc>
<style>
  text { font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, monospace; fill: #cdd2e4; }
  .title { font-size: 22px; font-weight: 700; }
  .heading { font-size: 14px; font-weight: 700; }
  .name { font-size: 14px; font-weight: 700; }
  .hex { font-size: 13px; }
  .ratio, .note { font-size: 12px; fill: #6a78a4; }
  .low { fill: #bb6579; } /* a CSS class, because CSS would override a fill="" attribute */
</style>
